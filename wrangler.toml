name = "study-plans-api"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

# 应用层自建登录（邮箱验证码 + GitHub OAuth）需要 Cloudflare TCP Sockets 直连 SMTP
# worker-mailer 依赖 cloudflare:sockets，需 nodejs_compat 兼容标志
compatibility_flags = ["nodejs_compat"]

# 静态资源：前端构建产物（单 Worker 同域托管 SPA + API）
routes = [
  { pattern = "study.hesen.dpdns.org", custom_domain = true }
]
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# 以下 ID 在部署阶段通过 wrangler 命令创建后回填
[[d1_databases]]
binding = "DB"
database_name = "study-plans"
database_id = "2eadc76a-5f4d-4af4-9464-dbbaa5b49b5a"

# 笔记与头像共用已在配置中声明的 study-plans-notes 桶（未在本次改动中新建桶）。
# 对象 key：笔记 notes/{user}/… ；头像 avatars/{user}/{uuid}.ext
# 本地 wrangler dev 默认使用本机 R2 模拟，不会写入远程桶。
[[r2_buckets]]
binding = "NOTES"
bucket_name = "study-plans-notes"

[[kv_namespaces]]
binding = "STATS_KV"
id = "bc6b7a8bba1346c393211c48d5e32ba8"

# 认证 session 存储（复用同一 KV，key 前缀 auth:session:）
# 说明：session token、邮箱验证码均存于 STATS_KV，无需单独命名空间

[[vectorize]]
binding = "VECTORS"
index_name = "study-notes"

[ai]
binding = "AI"

# 应用层登录：网易 163 SMTP（非敏感配置；SMTP_PASS 授权码走 secret，GitHub 凭据走 secret）
# 安全默认值：未配置 ALLOW_ANONYMOUS 时，除 /api/auth/* 外的接口未登录一律 401。
#   本地开发可在 .dev.vars 写 ALLOW_ANONYMOUS=true，或 `wrangler dev --var ALLOW_ANONYMOUS:true`。
#   线上请勿设置该变量。
# 跨域白名单（可选）：ALLOWED_ORIGINS=https://a.example.com,https://b.example.com
#   同源请求与回环地址（localhost / 127.0.0.1，供本地 Vite 代理）始终允许；
#   留空即只允许同源与回环。必须显式列举外部域名，不支持通配符 *。

# ============ 可观测性：Workers Logs + 链路追踪 ============
# 采样率 1 = 100%（个人项目流量低，便于完整排障）。
# 注意：2026-12-01 起按 Cloudflare Observability 用量计费，
#      流量上来后把下面两个 head_sampling_rate 调小即可（如 0.1）。
# 查看位置：Cloudflare Dashboard → Workers & Pages → study-plans-api → Observability
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
SMTP_HOST = "smtp.163.com"
SMTP_PORT = "465"
SMTP_USER = "note_service@163.com"
SMTP_FROM_NAME = "学习小助手"
